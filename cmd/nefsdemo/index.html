<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nefsdemo - 远程命令控制台</title>
<style>
:root {
  --bg: #0f1420; --panel: #1a2130; --border: #2a3348;
  --text: #dce3f0; --dim: #7a8699; --accent: #4c8dff;
  --green: #3ecf8e; --red: #ff5f56;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--text);
  font: 14px/1.6 "Segoe UI", Consolas, monospace;
  padding: 24px;
}
h1 { font-size: 18px; margin-bottom: 4px; }
.sub { color: var(--dim); font-size: 12px; margin-bottom: 16px; }
.row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
.panel {
  background: var(--panel); border: 1px solid var(--border);
  border-radius: 8px; padding: 14px; margin-bottom: 14px;
}
input, select, textarea {
  background: #111827; color: var(--text);
  border: 1px solid var(--border); border-radius: 6px;
  padding: 8px 10px; font: inherit; width: 100%;
}
textarea { resize: vertical; min-height: 56px; font-family: Consolas, monospace; }
label { color: var(--dim); font-size: 12px; display: block; margin-bottom: 4px; }
.inline { width: auto; }
button {
  background: var(--accent); color: #fff; border: none;
  border-radius: 6px; padding: 9px 18px; font: inherit; cursor: pointer;
}
button:hover { filter: brightness(1.1); }
button:disabled { opacity: .5; cursor: not-allowed; }
button.ghost { background: transparent; border: 1px solid var(--border); color: var(--dim); }
.badge { font-size: 12px; padding: 2px 8px; border-radius: 10px; }
.badge.ok { background: rgba(62,207,142,.15); color: var(--green); }
.badge.err { background: rgba(255,95,86,.15); color: var(--red); }
.badge.idle { background: rgba(122,134,153,.15); color: var(--dim); }
#conn { margin-left: auto; }
#result {
  background: #0b0f1a; border: 1px solid var(--border); border-radius: 6px;
  padding: 12px; white-space: pre-wrap; word-break: break-all;
  min-height: 160px; max-height: 420px; overflow: auto;
  font-family: Consolas, monospace; font-size: 13px;
}
#result .meta { color: var(--dim); font-size: 12px; margin-bottom: 8px; }
#result .stderr { color: #ff9f9c; }
#result .exit0 { color: var(--green); }
#result .exitN { color: var(--red); }
#history { max-height: 180px; overflow: auto; }
.hitem { padding: 4px 8px; border-bottom: 1px solid var(--border); font-size: 12px; cursor: pointer; }
.hitem:hover { background: #222b3d; }
.hitem .t { color: var(--dim); margin-right: 8px; }
.hitem .lat { float: right; color: var(--dim); }
.hitem .cmd { color: var(--text); }
</style>
</head>
<body>
<h1>nefsdemo · 远程命令控制台</h1>
<div class="sub">Windows 常驻进程 · nefsagent 长连接池 · 无进程启动开销（≈7ms/请求） · 连接 {{.Addr}}</div>

<div class="panel">
  <div class="row">
    <div style="width:200px;">
      <label>工作目录</label>
      <input id="cwd" value="" placeholder="(留空=默认)">
    </div>
    <div style="width:120px;">
      <label>超时(秒)</label>
      <input id="timeout" type="number" value="30" min="1">
    </div>
    <div style="margin-top:22px;">
      <button id="btnPing" class="ghost">Ping</button>
      <button id="btnExec">执行命令</button>
    </div>
    <span id="conn" class="badge idle">未检测</span>
  </div>
  <label>命令</label>
  <textarea id="cmd" placeholder="例如: uname -a&#10;ls -la /root&#10;cat /var/log/messages | grep error"></textarea>
</div>

<div class="panel">
  <label>结果</label>
  <div id="result"><span class="meta">等待执行…</span></div>
</div>

<div class="panel">
  <label>历史 (点击回填)</label>
  <div id="history"></div>
</div>

<script>
const $ = id => document.getElementById(id);
let hist = [];

async function post(path, body) {
  const r = await fetch(path, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(body)
  });
  return r.json();
}

async function ping() {
  const b = $('conn');
  b.className = 'badge idle'; b.textContent = 'Ping…';
  const t0 = performance.now();
  try {
    const r = await post('/api/ping', {});
    const ms = Math.round(performance.now() - t0);
    if (r.ok) { b.className = 'badge ok'; b.textContent = `已连接 · ${r.latency}ms`; }
    else { b.className = 'badge err'; b.textContent = '连接失败'; }
  } catch (e) {
    b.className = 'badge err'; b.textContent = '本地服务未运行';
  }
}

async function exec() {
  const cmd = $('cmd').value.trim();
  if (!cmd) return;
  $('btnExec').disabled = true;
  $('result').innerHTML = '<span class="meta">执行中…</span>';
  const t0 = performance.now();
  try {
    const r = await post('/api/exec', {
      cmd,
      cwd: $('cwd').value.trim(),
      timeout: parseFloat($('timeout').value) || 30
    });
    const ms = Math.round(performance.now() - t0);
    render(cmd, r, ms);
  } catch (e) {
    $('result').innerHTML = '<span class="meta">请求失败: ' + e + '</span>';
  }
  $('btnExec').disabled = false;
}

function render(cmd, r, ms) {
  if (!r.ok) {
    $('result').innerHTML =
      `<div class="meta">${cmd} — 失败 · ${ms}ms · ${r.error || ''}</div>`;
    return;
  }
  const ec = r.exit_code;
  const cls = ec === 0 ? 'exit0' : 'exitN';
  let html = `<div class="meta">exit=${ec} <span class="${cls}">${ec===0?'✓':'✗'}</span>` +
             ` · 耗时 <b>${r.latency_ms}ms</b> (端到端 ${ms}ms)` +
             (r.timed_out ? ' · <span style="color:#ffb020">超时</span>' : '') + '</div>';
  if (r.stdout) html += esc(r.stdout);
  if (r.stderr) html += '<div class="stderr">' + esc(r.stderr) + '</div>';
  $('result').innerHTML = html;

  hist.unshift({ cmd, latency: r.latency_ms, exit: ec, time: new Date().toLocaleTimeString() });
  hist = hist.slice(0, 20);
  paintHist();
}

function paintHist() {
  $('history').innerHTML = hist.map(h =>
    `<div class="hitem" onclick="fillCmd(this)">
       <span class="t">${h.time}</span>
       <span class="cmd">${esc(h.cmd.slice(0, 80))}</span>
       <span class="lat">${h.exit===0?'✓':'✗'} ${h.latency}ms</span>
     </div>`).join('');
}

function fillCmd(el) {
  const txt = el.querySelector('.cmd').textContent;
  $('cmd').value = txt;
}

function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

$('btnExec').onclick = exec;
$('btnPing').onclick = ping;
$('cmd').addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') exec();
});
ping();
</script>
</body>
</html>
